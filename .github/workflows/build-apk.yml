name: Build Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:      # يسمح بتشغيل يدوي من GitHub

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ─────────────────────────────────────────────
      # 1. Checkout الكود
      # ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 2. إعداد Java 17 (مطلوب لـ AGP 8.x)
      # ─────────────────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ─────────────────────────────────────────────
      # 3. إعداد Flutter
      # ─────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # ─────────────────────────────────────────────
      # 4. تنظيف + تثبيت الحزم
      # ─────────────────────────────────────────────
      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get

      # ─────────────────────────────────────────────
      # 5. بناء APK
      # ─────────────────────────────────────────────
      - name: Build Release APK
        run: flutter build apk --release

      # ─────────────────────────────────────────────
      # 6. Debug: لو فشل البناء نبحث عن APK ونطبع الأخطاء
      # ─────────────────────────────────────────────
      - name: Debug APK location (on failure)
        if: failure()
        run: |
          echo "❌ Build failed — debugging..."
          echo "=== Gradle logs ==="
          cat android/build.gradle
          echo ""
          echo "=== APK Search ==="
          find build -name "*.apk" -type f 2>/dev/null || true
          echo ""
          echo "=== Directory tree ==="
          ls -la build/app/outputs/ 2>/dev/null || true
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || true

      # ─────────────────────────────────────────────
      # 7. رفع APK كـ Artifact (يظهر في GitHub Actions)
      # ─────────────────────────────────────────────
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      # ─────────────────────────────────────────────
      # 8. (اختياري) رفع APK لـ GitHub Releases
      # ─────────────────────────────────────────────
      - name: Upload to Release (on tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
