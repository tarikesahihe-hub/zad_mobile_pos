allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

// Force compileSdk 34 on ALL subprojects (fixes printing module lStar error)

// Force compileSdk 34 on ALL subprojects (fixes printing/pdf lStar error)

// Force compileSdk 34 on ALL subprojects (fixes printing/pdf lStar error)
subprojects {
    afterEvaluate { proj ->
        if (proj.hasProperty("android")) {
            proj.android {
                compileSdkVersion 34
            }
        }
    }
}
